name: Feature request
description: Suggest an improvement to the repro-pack workflow
title: "[feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What team pain point are we trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Risks or tradeoffs
      description: Any operational, product, or security concerns
