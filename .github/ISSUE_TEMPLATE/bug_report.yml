name: Bug report
description: Report a bug or broken workflow in the repro-pack system
title: "[bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: How can we reproduce it?
      placeholder: |
        1. Run ...
        2. Submit ...
        3. Observe ...
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, OS, fixture or provider path, relevant config
  - type: textarea
    id: evidence
    attributes:
      label: Logs / evidence
      description: Include sanitized snippets only
